<body>

<div class="calculator">
  <div class="mode-indicator">
    <span id="angleBtn" onclick="toggleAngle()">DEG</span>
    <span id="fracBtn" onclick="toggleFractionMode()">کسر: خودکار</span>

  </div>

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
    <div class="fraction-view" id="fractionView"></div>
  </div>

  <div class="buttons">
    <button class="func" onclick="press('sin(')">sin</button>
    <button class="func" onclick="press('cos(')">cos</button>
    <button class="func" onclick="press('tan(')">tan</button>
    <button class="func" onclick="press('ln(')">ln</button>

    <button class="equal span2" onclick="calculate()">=</button>
  </div>
</div>

<script>
/* ============================================================
   ۱) صدا با Web Audio API (بدون فایل خارجی)
   ============================================================ */
let audioCtx = null;
let soundEnabled = true;
const soundBtn = document.getElementById('soundBtn');

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* پشتیبانی نمی‌شود */ }
  }
}

function playClick(freq = 800, duration = 0.05, type = 'sine') {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.6, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? "🔊 صدا" : "🔇 بی‌صدا";
  if (soundEnabled) playClick(1000, 0.06);
}

/* ============================================================
   ۲) ماژول کسر با BigInt
   ============================================================ */
function gcd(a, b) {
  a = a < 0n ? -a : a;
  b = b < 0n ? -b : b;
  while (b) { [a, b] = [b, a % b]; }
  return a;
}
class Frac {
  constructor(n, d = 1n) {
    if (d === 0n) throw new Error("تقسیم بر صفر");
    if (d < 0n) { n = -n; d = -d; }
    const g = gcd(n, d) || 1n;
    this.n = n / g; this.d = d / g;
  }
  add(o) { return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Frac(this.n * o.n, this.d * o.d); }
  div(o) { return new Frac(this.n * o.d, this.d * o.n); }
  neg() { return new Frac(-this.n, this.d); }
  isZero() { return this.n === 0n; }
  toNumber() { return Number(this.n) / Number(this.d); }
  toString() { return this.d === 1n ? this.n.toString() : `${this.n}/${this.d}`; }
}

/* ============================================================
   ۳) حالت‌ها و متغیرها
   ============================================================ */
let expr = "";
let isDegree = true;
let fractionMode = "auto";

const expressionEl = document.getElementById('expression');
const resultEl = document.getElementById('result');
const fractionViewEl = document.getElementById('fractionView');
const angleBtn = document.getElementById('angleBtn');
const fracBtn = document.getElementById('fracBtn');

/* ============================================================
   ۴) رندر عبارت با کسرهای عمودی
   استراتژی: رشته expr رو پیمایش می‌کنیم، هر جا الگوی «عدد/عدد»
   دیدیم، آن را به HTML کسری تبدیل می‌کنیم.
   ============================================================ */
function renderExpression(str) {
  if (!str) return "";
  // الگوی ساده: رقم (یا پرانتز) / رقم (یا پرانتز)
  // برای جلوگیری از پیچیدگی، فقط الگوی «عدد صحیح یا اعشاری / عدد صحیح یا اعشاری» را کسری می‌کنیم.
  const regex = /(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/g;
  let out = "";
  let lastIndex = 0;
  let m;
  while ((m = regex.exec(str)) !== null) {
    // متن قبل از کسر
    out += escapeHTML(str.slice(lastIndex, m.index));
    // خود کسر
    out += `<span class="frac"><span class="num">${escapeHTML(m[1])}</span><span class="den">${escapeHTML(m[2])}</span></span>`;
    lastIndex = regex.lastIndex;
  }
  out += escapeHTML(str.slice(lastIndex));
  return out;
}

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* رندر نتیجه: اگر کسر بود، عمودی نشون بده */
function renderResult(fracStr, decVal) {
  // اگر fracStr به شکل «a/b» است
  const m = fracStr.match(/^(-?\d+)\/(\d+)$/);
  if (m) {
    let html = `<span class="frac"><span class="num">${m[1]}</span><span class="den">${m[2]}</span></span>`;
    if (fractionMode === "auto" && decVal !== undefined && isFinite(decVal) && m[2] !== "1") {
      fractionViewEl.innerHTML = "≈ " + escapeHTML(formatNumber(decVal));
    } else {
      fractionViewEl.innerHTML = "";
    }
    return html;
  }
  return escapeHTML(fracStr);
}

/* ============================================================
   ۵) توابع مثلثاتی و تبدیل به JS
   ============================================================ */
function __sinD(x) { return Math.sin(x * Math.PI / 180); }
function __cosD(x) { return Math.cos(x * Math.PI / 180); }
function __tanD(x) { return Math.tan(x * Math.PI / 180); }
function __fact(n) {
  if (n < 0 || !Number.isInteger(n)) return NaN;
  if (n > 170) return Infinity;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}
function toJS(expression) {
  let s = expression
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
    .replace(/π/g, '(Math.PI)').replace(/\be\b/g, '(Math.E)');
  s = s.replace(/sin\(/g, isDegree ? '__sinD(' : 'Math.sin(');
  s = s.replace(/cos\(/g, isDegree ? '__cosD(' : 'Math.cos(');
  s = s.replace(/tan\(/g, isDegree ? '__tanD(' : 'Math.tan(');
  s = s.replace(/ln\(/g, 'Math.log(');
  s = s.replace(/log\(/g, 'Math.log10(');
  s = s.replace(/√\(/g, 'Math.sqrt(');
  s = s.replace(/abs\(/g, 'Math.abs(');
  s = s.replace(/exp\(/g, 'Math.exp(');
  s = s.replace(/\^/g, '**');
  s = s.replace(/(\d+(?:\.\d+)?|\))!/g, '__fact($1)');
  s = s.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
  return s;
}

/* ============================================================
   ۶) ارزیابی کسری دقیق
   ============================================================ */
function evaluateFraction(expression) {
  if (/[a-zA-Z√π]/.test(expression.replace(/e/g, ''))) return null;
  try {
    const tokens = tokenize(expression);
    const parser = new FracParser(tokens);
    const result = parser.parseExpression();
    if (!parser.isEnd()) return null;
    return result;
  } catch { return null; }
}
function tokenize(s) {
  s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  const tokens = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) {
      let num = '';
      while (i < s.length && /[0-9.]/.test(s[i])) num += s[i++];
      tokens.push({ type: 'num', value: num });
    } else if ('+-*/()%^!'.includes(c)) {
      tokens.push({ type: c }); i++;
    } else throw new Error("کاراکتر نامعتبر");
  }
  return tokens;
}
class FracParser {
  constructor(tokens) { this.tokens = tokens; this.pos = 0; }
  peek() { return this.tokens[this.pos]; }
  next() { return this.tokens[this.pos++]; }
  isEnd() { return this.pos >= this.tokens.length; }
  parseExpression() {
    let left = this.parseTerm();
    while (this.peek() && (this.peek().type === '+' || this.peek().type === '-')) {
      const op = this.next().type;
      const right = this.parseTerm();
      left = op === '+' ? left.add(right) : left.sub(right);
    }
    return left;
  }
  parseTerm() {
    let left = this.parseFactor();
    while (this.peek() && (this.peek().type === '*' || this.peek().type === '/')) {
      const op = this.next().type;
      const right = this.parseFactor();
      if (op === '*') left = left.mul(right);
      else {
        if (right.isZero()) throw new Error("تقسیم بر صفر");
        left = left.div(right);
      }
    }
    return left;
  }
  parseFactor() {
    let base = this.parseUnary();
    if (this.peek() && this.peek().type === '^') {
      this.next();
      const exp = this.parseFactor();
      if (exp.d !== 1n) throw new Error("توان کسری");
      const e = Number(exp.n);
      if (!Number.isInteger(e) || Math.abs(e) > 100) throw new Error("توان نامعتبر");
      let result = new Frac(1n);
      for (let i = 0; i < Math.abs(e); i++) result = result.mul(base);
      if (e < 0) result = new Frac(1n).div(result);
      base = result;
    }
    return base;
  }
  parseUnary() {
    if (this.peek() && this.peek().type === '-') { this.next(); return this.parseUnary().neg(); }
    if (this.peek() && this.peek().type === '+') { this.next(); return this.parseUnary(); }
    return this.parsePostfix();
  }
  parsePostfix() {
    let val = this.parsePrimary();
    while (this.peek() && (this.peek().type === '%' || this.peek().type === '!')) {
      if (this.peek().type === '%') { this.next(); val = new Frac(val.n, val.d * 100n); }
      else {
        this.next();
        if (val.d !== 1n || val.n < 0n) throw new Error("فاکتوریل نامعتبر");
        const n = Number(val.n); let r = 1n;
        for (let i = 2n; i <= BigInt(n); i++) r *= i;
        val = new Frac(r);
      }
    }
    return val;
  }
  parsePrimary() {
    const t = this.peek();
    if (!t) throw new Error("پایان غیرمنتظره");
    if (t.type === 'num') {
      this.next();
      if (t.value.includes('.')) {
        const [intPart, decPart = ''] = t.value.split('.');
        const denom = 10n ** BigInt(decPart.length);
        const num = BigInt((intPart || '0') + decPart);
        return new Frac(num, denom);
      }
      return new Frac(BigInt(t.value));
    }
    if (t.type === '(') {
      this.next();
      const val = this.parseExpression();
      if (!this.peek() || this.peek().type !== ')') throw new Error("پرانتز بسته نشده");
      this.next();
      return val;
    }
    throw new Error("توکن غیرمنتظره");
  }
}

/* ============================================================
   ۷) نمایش و آپدیت
   ============================================================ */
function formatNumber(n) {
  if (Number.isInteger(n)) return n.toString();
  return parseFloat(n.toPrecision(12)).toString();
}
function formatFrac(frac) {
  return frac.d === 1n ? frac.n.toString() : `${frac.n}/${frac.d}`;
}

function updateDisplay() {
  // نمایش عبارت با کسرهای عمودی
  expressionEl.innerHTML = renderExpression(expr);
  fractionViewEl.textContent = "";

  if (!expr) { resultEl.textContent = "0"; return; }

  const frac = evaluateFraction(expr);
  if (frac) {
    const fracStr = formatFrac(frac);
    const decVal = frac.toNumber();
    if (fractionMode === "auto") {
      resultEl.innerHTML = renderResult(fracStr, decVal);
    } else {
      resultEl.textContent = isFinite(decVal) ? formatNumber(decVal) : "خطا";
      if (frac.d !== 1n) {
        fractionViewEl.innerHTML = "کسر: " + renderResult(fracStr);
      }
    }
    return;
  }
  try {
    const jsExpr = toJS(expr);
    const val = Function('"use strict";return (' + jsExpr + ')')();
    if (typeof val !== 'number') { resultEl.textContent = "…"; return; }
    if (!isFinite(val)) { resultEl.textContent = "خطا"; return; }
    resultEl.textContent = formatNumber(val);
  } catch { resultEl.textContent = "…"; }
}

function calculate() {
  if (!expr) return;
  playClick(1200, 0.08, 'triangle');
  const frac = evaluateFraction(expr);
  if (frac) {
    const fracStr = formatFrac(frac);
    const decVal = frac.toNumber();
    expressionEl.innerHTML = renderExpression(expr) + " =";
    if (fractionMode === "auto") {
      resultEl.innerHTML = renderResult(fracStr, decVal);
      expr = fracStr;
    } else {
      resultEl.textContent = formatNumber(decVal);
      fractionViewEl.innerHTML = frac.d !== 1n ? "کسر: " + renderResult(fracStr) : "";
      expr = formatNumber(decVal);
    }
    return;
  }
  try {
    const jsExpr = toJS(expr);
    const val = Function('"use strict";return (' + jsExpr + ')')();
    if (typeof val !== 'number' || !isFinite(val)) { resultEl.textContent = "خطا"; return; }
    expressionEl.innerHTML = renderExpression(expr) + " =";
    resultEl.textContent = formatNumber(val);
    fractionViewEl.textContent = "";
    expr = formatNumber(val);
  } catch { resultEl.textContent = "خطا"; }
}

/* ============================================================
   ۸) صدا در ورودی‌ها
   ============================================================ */
function press(v) {
  playClick(700 + Math.random() * 200, 0.04, 'sine');
  expr += v;
  updateDisplay();
}
function clearAll() {
  playClick(400, 0.15, 'sawtooth');
  expr = "";
  updateDisplay();
}
function backspace() {
  playClick(500, 0.05, 'square');
  expr = expr.slice(0, -1);
  updateDisplay();
}
function toggleAngle() {
  playClick(900, 0.06);
  isDegree = !isDegree;
  angleBtn.textContent = isDegree ? "DEG" : "RAD";
  updateDisplay();
}
function toggleFractionMode() {
  playClick(900, 0.06);
  fractionMode = fractionMode === "auto" ? "decimal" : "auto";
  fracBtn.textContent = fractionMode === "auto" ? "کسر: خودکار" : "کسر: اعشاری";
  updateDisplay();
}

/* کیبورد */
document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (/[0-9.]/.test(k)) press(k);
  else if (k === '+') press('+');
  else if (k === '-') press('-');
  else if (k === '*') press('×');
  else if (k === '/') { e.preventDefault(); press('/'); }
  else if (k === '(' || k === ')') press(k);
  else if (k === '^') press('^');
  else if (k === '%') press('%');
  else if (k === '!') press('!');
  else if (k === 'Enter' || k === '=') { e.preventDefault(); calculate(); }
  else if (k === 'Backspace') { e.preventDefault(); backspace(); }
  else if (k === 'Escape') clearAll();
});

updateDisplay();
</script>
